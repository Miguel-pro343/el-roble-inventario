
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#263d32">
  <title>EL ROBLE | Control de materiales</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f3f1;
      color: #263d32;
    }

    header {
      background: #263d32;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 4px;
    }

    header p {
      font-size: 12px;
      letter-spacing: 2px;
    }

    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 15px;
    }

    .panel {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000012;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #263d32;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #resultado {
      margin-top: 24px;
    }

    .dato {
      padding: 13px 5px;
      border-bottom: 1px solid #eee;
    }

    .dato strong {
      display: block;
      margin-bottom: 5px;
    }

    .mensaje {
      padding: 15px;
      border-radius: 7px;
      background: #f4eeee;
      color: #963333;
    }

    .material {
      border-left: 4px solid #395846;
      padding-left: 15px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>EL ROBLE</h1>
    <p>SISTEMA DE CONTROL DE MATERIALES</p>
  </header>

  <main>
    <section class="panel">

      <h2>Consulta de materiales</h2>
      <p>Consulta la información de los materiales registrados en el sistema.</p>

      <label for="codigo">Código del material</label>

      <input
        type="text"
        id="codigo"
        placeholder="Ejemplo: MP-001"
        autocomplete="off"
      >

      <button id="btnConsultar" onclick="consultar()">
        Consultar material
      </button>

      <div id="resultado"></div>

    </section>
  </main>

  <footer>
    EL ROBLE | Control de materiales y producción
  </footer>

  <script>
    // Dirección de la aplicación de Google Apps Script.
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzKYxWpSw7b4mV2bEeu6GfCysEKenvidzgSSuNDdpFwX20DPtet_cRtsIjcaPZtsB7ptQ/exec";

    function consultar() {
      const codigo = document.getElementById("codigo").value.trim();
      const resultado = document.getElementById("resultado");
      const boton = document.getElementById("btnConsultar");

      if (!codigo) {
        resultado.innerHTML =
          '<div class="mensaje">Introduce un código de material.</div>';
        return;
      }

      resultado.textContent = "Consultando material...";
      boton.disabled = true;

      const callback = "respuestaMaterial";
      const anterior = document.getElementById("consultaAPI");

      if (anterior) anterior.remove();

      // Evita dejar una consulta bloqueada si el servidor no responde.
      window.respuestaMaterial = function(datos) {
        boton.disabled = false;

        if (typeof datos === "string") {
          resultado.innerHTML =
            '<div class="mensaje">' + escapar(datos) + '</div>';
          return;
        }

        resultado.innerHTML = `
          <div class="material">
            <h3>Material encontrado</h3>
            <div class="dato">
              <strong>Código</strong>
              ${escapar(datos.codigo)}
            </div>
            <div class="dato">
              <strong>Tipo</strong>
              ${escapar(datos.tipo)}
            </div>
            <div class="dato">
              <strong>Descripción</strong>
              ${escapar(datos.descripcion)}
            </div>
            <div class="dato">
              <strong>Unidad</strong>
              ${escapar(datos.unidad)}
            </div>
          </div>
        `;
      };

      const script = document.createElement("script");
      script.id = "consultaAPI";

      script.src =
        API_URL +
        "?callback=" + callback +
        "&codigo=" + encodeURIComponent(codigo) +
        "&t=" + Date.now();

      script.onerror = function() {
        boton.disabled = false;
        resultado.innerHTML =
          '<div class="mensaje">No fue posible consultar el material. Comprueba la conexión y los permisos de acceso.</div>';
      };

      document.body.appendChild(script);
    }

    function escapar(valor) {
      return String(valor ?? "").replace(/[&<>"']/g, function(c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];
      });
    }

    // Consulta automática cuando se abre desde un QR.
    window.addEventListener("load", function() {
      const parametros = new URLSearchParams(window.location.search);
      const codigoQR = parametros.get("codigo");

      if (codigoQR) {
        document.getElementById("codigo").value = codigoQR;
        consultar();
      }
    });

    document.getElementById("codigo").addEventListener("keydown", function(e) {
      if (e.key === "Enter") consultar();
    });
  </script>

</body>
</html>
