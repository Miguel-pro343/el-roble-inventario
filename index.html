
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#263d32">
  <title>EL ROBLE | Control de materiales</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f3f1;
      color: #263d32;
    }

    header {
      background: #263d32;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 4px;
    }

    header p {
      font-size: 12px;
      letter-spacing: 2px;
    }

    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 15px;
    }

    .panel {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000012;
    }

    h2 {
      margin-top: 0;
    }

    .dato {
      padding: 14px 5px;
      border-bottom: 1px solid #eee;
    }

    .dato strong {
      display: block;
      margin-bottom: 5px;
    }

    .material {
      border-left: 4px solid #395846;
      padding-left: 15px;
      margin-top: 20px;
    }

    .mensaje {
      padding: 15px;
      border-radius: 7px;
      background: #f4eeee;
      color: #963333;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>EL ROBLE</h1>
    <p>SISTEMA DE CONTROL DE MATERIALES</p>
  </header>

  <main>
    <section class="panel">
      <h2>Consulta de materiales</h2>
      <p>Información del material registrado en el sistema.</p>

      <div id="resultado"></div>
    </section>
  </main>

  <footer>
    EL ROBLE | Control de materiales y producción
  </footer>

  <script>
    const materiales = {
      "MP-001": {
        codigo: "MP-001",
        tipo: "MP",
        descripcion: "Tarimas recuperadas",
        unidad: "Pieza"
      }
    };

    function consultarMaterial() {
      const parametros = new URLSearchParams(
        window.location.search
      );

      const codigo = (
        parametros.get("codigo") || ""
      ).trim().toUpperCase();

      const resultado = document.getElementById("resultado");

      if (!codigo) {
        resultado.innerHTML =
          '<div class="mensaje">No se recibió un código de material.</div>';
        return;
      }

      const material = materiales[codigo];

      if (!material) {
        resultado.innerHTML =
          '<div class="mensaje">Material no encontrado: ' +
          escapar(codigo) + '</div>';
        return;
      }

      resultado.innerHTML = `
        <div class="material">
          <h3>Material encontrado</h3>

          <div class="dato">
            <strong>Código</strong>
            ${escapar(material.codigo)}
          </div>

          <div class="dato">
            <strong>Tipo</strong>
            ${escapar(material.tipo)}
          </div>

          <div class="dato">
            <strong>Descripción</strong>
            ${escapar(material.descripcion)}
          </div>

          <div class="dato">
            <strong>Unidad</strong>
            ${escapar(material.unidad)}
          </div>
        </div>
      `;
    }

    function escapar(valor) {
      return String(valor).replace(/[&<>"']/g, function(c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];
      });
    }

    consultarMaterial();
  </script>

</body>
</html>
